{% extends 'base.html' %}
{% load django_bootstrap5 %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 bg-white p-4 border rounded shadow-sm">
        <h1 class="mb-4">Eliminar usuario</h1>
        <p>¿Estás seguro de que quieres eliminar a <strong>{{ object.get_full_name }}</strong> ({{ object.username }})?</p>
        <form method="post">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger">Sí, eliminar</button>
            <a href="{% url 'users_list' %}" class="btn btn-secondary ms-2">Cancelar</a>
        </form>
    </div>
</div>
{% endblock %}
