{% extends 'base.html' %}

{% block content %}
<h1 class="my-4">Etiquetas</h1>
<a class="btn btn-primary mb-3" href="{% url 'label_create' %}">Crear etiqueta</a>

<table class="table table-striped table-hover bg-white border">
    <thead class="table-dark">
        <tr>
            <th>ID</th>
            <th>Nombre</th>
            <th>Fecha de creación</th>
            <th>Acciones</th>
        </tr>
    </thead>
    <tbody>
        {% for label in labels %}
        <tr>
            <td>{{ label.id }}</td>
            <td>{{ label.name }}</td>
            <td>{{ label.created_at|date:"d.m.Y H:i" }}</td>
            <td>
                <a href="{% url 'label_update' label.id %}">Editar</a>
                <a href="{% url 'label_delete' label.id %}" class="text-danger ms-2">Eliminar</a>
            </td>
        </tr>
        {% empty %}
        <tr>
            <td colspan="4" class="text-center text-muted py-3">No hay etiquetas creadas.</td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
