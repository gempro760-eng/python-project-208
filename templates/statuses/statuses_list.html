{% extends 'base.html' %}

{% block content %}
<h1 class="my-4">Estados</h1>
<a class="btn btn-primary mb-3" href="{% url 'status_create' %}">Crear estado</a>

<table class="table table-striped table-hover bg-white border">
    <thead class="table-dark">
        <tr>
            <th>ID</th>
            <th>Nombre</th>
            <th>Fecha de creación</th>
            <th>Acciones</th>
        </tr>
    </thead>
    <tbody>
        {% for status in statuses %}
        <tr>
            <td>{{ status.id }}</td>
            <td>{{ status.name }}</td>
            <td>{{ status.created_at|date:"d.m.Y H:i" }}</td>
            <td>
                <a href="{% url 'status_update' status.id %}">Editar</a>
                <a href="{% url 'status_delete' status.id %}" class="text-danger ms-2">Eliminar</a>
            </td>
        </tr>
        {% empty %}
        <tr>
            <td colspan="4" class="text-center text-muted py-3">No hay estados creados.</td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
